name: Release

# Trigger: push a version tag  →  git tag v2.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=chat-exporter-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: bash build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chat Exporter v${{ steps.version.outputs.version }}"
          body: |
            ## Cài đặt

            1. Tải file **${{ steps.version.outputs.zip }}** về máy
            2. Giải nén ra một thư mục
            3. Mở Chrome → **chrome://extensions**
            4. Bật **Developer mode** (góc trên bên phải)
            5. Nhấn **Load unpacked** → chọn thư mục vừa giải nén
            6. Vào Instagram DM hoặc Zalo Web → nhấn icon extension

            ## Nền tảng hỗ trợ
            - ✅ Instagram Direct Messages
            - ✅ Zalo Web (chat.zalo.me)
          files: dist/${{ steps.version.outputs.zip }}
          draft: false
          prerelease: false
